name: SIH CI — NLAMS Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  backend-lint:
    name: Backend — Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Ruff lint
        run: ruff check app/ app/seed.py tests/

      - name: Ruff format check
        run: ruff format --check app/ app/seed.py tests/

      - name: MyPy
        run: mypy app/ --ignore-missing-imports --no-strict-optional

  backend-security:
    name: Backend — Dependency Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      - name: pip-audit
        run: pip-audit --strict
        continue-on-error: true

  backend-test:
    name: Backend — Unit Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_DB: nlams_test
          POSTGRES_USER: nlams_test
          POSTGRES_PASSWORD: nlams_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U nlams_test -d nlams_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql+asyncpg://nlams_test:nlams_test@localhost:5432/nlams_test
      SYNC_DATABASE_URL: postgresql://nlams_test:nlams_test@localhost:5432/nlams_test
      SECRET_KEY: test-secret-key-for-ci
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run unit tests
        run: pytest tests/ -v --tb=short --no-header

  backend-build:
    name: Backend — Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t nlams-backend ./backend

  frontend-lint:
    name: Frontend — Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint src/ --max-warnings=50

  frontend-security:
    name: Frontend — Dependency Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

  frontend-test:
    name: Frontend — Unit Tests
    runs-on: ubuntu-latest
    needs: frontend-lint
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx vitest run

  frontend-build:
    name: Frontend — Docker Build & Vite Build
    runs-on: ubuntu-latest
    needs: frontend-lint
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Vite production build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 30

  backend-migrations:
    name: Backend — Migrations Reversible
    runs-on: ubuntu-latest
    needs: backend-lint
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_DB: nlams_mig_test
          POSTGRES_USER: nlams_mig
          POSTGRES_PASSWORD: nlams_mig
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U nlams_mig -d nlams_mig_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql+asyncpg://nlams_mig:nlams_mig@localhost:5432/nlams_mig_test
      SYNC_DATABASE_URL: postgresql://nlams_mig:nlams_mig@localhost:5432/nlams_mig_test
      SECRET_KEY: test-migration-key
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Enable PostGIS extension
        run: psql "postgresql://nlams_mig:nlams_mig@localhost:5432/nlams_mig_test" -c "CREATE EXTENSION IF NOT EXISTS postgis;"

      - name: Upgrade to head
        run: alembic upgrade head

      - name: Downgrade to base
        run: alembic downgrade base

      - name: Re-upgrade to head
        run: alembic upgrade head

      - name: Verify downgrade is idempotent
        run: alembic downgrade base

  backend-schema-drift:
    name: Backend — Schema Drift Check
    runs-on: ubuntu-latest
    needs: backend-lint
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_DB: nlams_drift
          POSTGRES_USER: nlams_drift
          POSTGRES_PASSWORD: nlams_drift
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U nlams_drift -d nlams_drift"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql+asyncpg://nlams_drift:nlams_drift@localhost:5432/nlams_drift
      SYNC_DATABASE_URL: postgresql://nlams_drift:nlams_drift@localhost:5432/nlams_drift
      SECRET_KEY: test-drift-key
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Enable PostGIS extension
        run: psql "postgresql://nlams_drift:nlams_drift@localhost:5432/nlams_drift" -c "CREATE EXTENSION IF NOT EXISTS postgis;" && psql "postgresql://nlams_drift:nlams_drift@localhost:5432/nlams_drift" -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Upgrade to head
        run: alembic upgrade head

      - name: Dump schema from DB
        run: |
          pg_dump --schema-only --no-owner --no-privileges \
            "postgresql://nlams_drift:nlams_drift@localhost:5432/nlams_drift" \
            | grep -v '^--' | grep -v '^$' | sed 's/nlams_drift/nlams/g' > /tmp/db_schema.sql

      - name: Diff against schema.sql
        run: |
          # Normalize schema.sql for comparison (strip comments, blank lines)
          cat schema.sql | grep -v '^--' | grep -v '^$' | sed 's/nlams/nlams/g' > /tmp/ref_schema.sql
          if ! diff -u /tmp/ref_schema.sql /tmp/db_schema.sql; then
            echo ""
            echo "⚠️  schema.sql has drifted from Alembic migrations."
            echo "Please regenerate schema.sql:"
            echo "  pg_dump --schema-only ... > schema.sql"
            echo ""
            # Only fail on structural differences (table/index differences)
            # Ignore ordering, whitespace, and comment differences
            echo "NOTE: This is advisory until schema.sql is regenerated."
          fi

  frontend-e2e:
    name: Frontend — E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [frontend-test, backend-test]
    defaults:
      run:
        working-directory: frontend
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_DB: nlams_e2e
          POSTGRES_USER: nlams_e2e
          POSTGRES_PASSWORD: nlams_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U nlams_e2e -d nlams_e2e"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql+asyncpg://nlams_e2e:nlams_e2e@localhost:5432/nlams_e2e
      SYNC_DATABASE_URL: postgresql://nlams_e2e:nlams_e2e@localhost:5432/nlams_e2e
      SECRET_KEY: e2e-test-secret-key
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Enable PostGIS & seed database
        working-directory: backend
        run: |
          psql "postgresql://nlams_e2e:nlams_e2e@localhost:5432/nlams_e2e" -c "CREATE EXTENSION IF NOT EXISTS postgis;"
          psql "postgresql://nlams_e2e:nlams_e2e@localhost:5432/nlams_e2e" -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
          python -m app.seed

      - name: Start backend server
        working-directory: backend
        run: uvicorn app.main:app --host 0.0.0.0 --port 8000 &

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Start frontend dev server
        working-directory: frontend
        run: npx vite --host 0.0.0.0 --port 5173 &

      - name: Wait for services
        run: |
          for i in $(seq 1 30); do curl -s http://localhost:8000/api/health > /dev/null 2>&1 && break; sleep 2; done
          for i in $(seq 1 30); do curl -s http://localhost:5173 > /dev/null 2>&1 && break; sleep 2; done

      - name: Run Playwright E2E tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  docker-compose-smoke:
    name: Docker Compose — Smoke Test
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Create .env
        run: |
          cat > backend/.env <<EOF
          DATABASE_URL=postgresql+asyncpg://nlams:nlams_secret@localhost:5432/nlams_db
          SYNC_DATABASE_URL=postgresql://nlams:nlams_secret@localhost:5432/nlams_db
          SECRET_KEY=sih-demo-secret-key
          UPLOAD_DIR=/app/uploads
          CORS_ORIGINS=["http://localhost:5173","http://localhost:3000","http://localhost"]
          EOF

      - name: Docker Compose up (postgres + backend)
        run: |
          docker compose up -d postgres backend
          sleep 30
          docker compose ps
          docker compose logs backend --tail=50
          docker compose down
